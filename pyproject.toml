[project]
name = "anki-doctor"
version = "0.1.0"
description = "Generate Anki cards with a local LLM and find/fill missing note fields"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
anki-doctor = "ankidoctor.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ankidoctor"]
